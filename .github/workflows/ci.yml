name: CI

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run quality gate
        # The quality suite uses synthetic fixtures and the test-only recovery
        # key backend. Production-mode packaging is verified separately below
        # by the artifact-only package smoke.
        env:
          JARVIS_ENVIRONMENT: test
        run: python scripts/quality.py
      - name: Run deterministic system self-tests
        env:
          JARVIS_ENVIRONMENT: test
        run: python scripts/run_system_tests.py --suite deterministic-workflows
      - name: Run deterministic permission self-tests
        env:
          JARVIS_ENVIRONMENT: test
        run: python scripts/run_system_tests.py --suite deterministic-permissions
      - name: Run v1 acceptance suite
        env:
          JARVIS_ENVIRONMENT: test
        run: python scripts/run_system_tests.py --suite v1-acceptance
      - name: Run artifact-only package smoke
        run: python scripts/package_smoke.py
